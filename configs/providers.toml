[stages.vision]
primary = "mimo"

[stages.translation]
primary = "mimo"

[translation]
# semantic-parallel: parallelises semantic-translation LLM calls per page
# (ThreadPoolExecutor, max_concurrent_requests workers) while keeping persona
# rendering serial for memory consistency. Default flipped from "serial" because
# translation is 87% of pipeline runtime (2114s/2437s on 10-page e2e).
parallel_mode = "semantic-parallel"
max_concurrent_requests = 5
semantic_timeout = 60

[stages.qa]
primary = "mimo"

[ocr_guard]
enabled = true
consecutive_blank_threshold = 3
min_text_length = 3
# Empty means prompt interactively when blank pages are detected.
auto_recovery_strategy = ""

[ocr_guard.hybrid_mode]
enabled = false
# Empty means use stages.vision.primary.
vision_model_override = ""

[providers.mimo]
provider_type = "openai"
api_key_env = "MIMO_API_KEY"
base_url_env = "MIMO_BASE_URL"
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
vision_model = "mimo-v2.5"
text_model = "mimo-v2.5-pro"
