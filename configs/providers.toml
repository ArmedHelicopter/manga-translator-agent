[stages.vision]
primary = "mimo"

[stages.translation]
primary = "mimo"

[translation]
# SERIAL by default: mimo token-plan has a low concurrency limit, so
# semantic-parallel's 5 workers exceed it → concurrent calls fail with
# "No provider available", burn the 60s semantic_timeout, then fall back to
# serial anyway. Serial default avoids that wasted timeout on every page.
# Set "semantic-parallel" only with a provider that allows real concurrency
# (OpenAI/Gemini) — but NOTE: parallel speedup is UNVERIFIED on any high-concurrency
# provider (only mimo tested, which throttles). See docs/p4-performance-analysis.md.
parallel_mode = "serial"
max_concurrent_requests = 5
semantic_timeout = 60

[stages.qa]
primary = "mimo"

[ocr_guard]
enabled = true
consecutive_blank_threshold = 3
min_text_length = 3
# Empty means prompt interactively when blank pages are detected.
auto_recovery_strategy = ""

[ocr_guard.hybrid_mode]
enabled = false
# Empty means use stages.vision.primary.
vision_model_override = ""

[providers.mimo]
provider_type = "openai"
api_key_env = "MIMO_API_KEY"
base_url_env = "MIMO_BASE_URL"
base_url = "https://token-plan-cn.xiaomimimo.com/v1"
vision_model = "mimo-v2.5"
text_model = "mimo-v2.5-pro"
